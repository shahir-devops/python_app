apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: test
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 30
  replicas: 3
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
      - name: orderservice
        image:  shahir5890/pythonorder:v1.0.version
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 256m
            memory: 256Mi
          limits:
            cpu: 512m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 30
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 20
---
apiVersion: v1
kind: Service 
metadata:
  name: ordersvc
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
  - port: 80
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orderingress
  namespace: test
spec:
  rules:
  - host: health.order
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: 
            name:  ordersvc
            port:
              number: 80
          
